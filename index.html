<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caramelo Token</title>
  <style>
    /* Reset básico */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Arial', sans-serif;
      color: #f5c169;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(-45deg, #0d0d0d, #1a1a1a, #262626, #0d0d0d);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      margin-top: 40px;
    }

    img.logo {
      width: 200px;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(245, 193, 105, 0.4);
      transition: transform 0.3s ease;
    }

    img.logo:hover {
      transform: scale(1.08);
    }

    h1 {
      margin: 20px 0 10px;
      font-size: 2.8em;
      text-shadow: 0px 0px 8px rgba(245,193,105,0.3);
    }

    p.slogan {
      font-size: 1.2em;
      font-style: italic;
      margin-bottom: 40px;
    }

    a.button {
      display: inline-block;
      padding: 15px 30px;
      background-color: #f5c169;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
      margin-bottom: 60px;
      box-shadow: 0 4px 12px rgba(245,193,105,0.4);
    }

    a.button:hover {
      background-color: #ffdd87;
      box-shadow: 0 6px 16px rgba(255,221,135,0.5);
    }

    main p {
      font-size: 1.1em;
      margin-bottom: 30px;
      padding: 0 20px;
    }

    footer {
      font-size: 0.9em;
      color: #aaa;
      margin: 20px 0;
    }

    /* Responsividade */
    @media (max-width: 480px) {
      h1 { font-size: 2.2em; }
      p.slogan { font-size: 1em; }
      a.button { padding: 12px 20px; }
      img.logo { width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="8290F52E-275F-4E51-B032-EC53A373F861.png" alt="Caramelo Token Logo" class="logo">
    <h1>Caramelo Token</h1>
    <p class="slogan">"We don’t need pedigree to be legendary"</p>
  </header>

  <main>
    <p>The meme coin inspired by the Brazilian street legend: the Caramelo Dog 🐕</p>
    <a class="button" href="https://pancakeswap.finance/swap?outputCurrency=0x3b88966075Afcd7DadE40f439c1B7DC2539CE80d" target="_blank">
      Buy on PancakeSwap
    </a>
  </main>

  <footer>
    © 2025 Caramelo Token Community · All Rights Reserved
  </footer>
</body>
</html>
