<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caramelo Token</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5c169;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      margin-top: 40px;
    }
    img.logo {
      width: 220px;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    img.logo:hover {
      transform: scale(1.05);
    }
    h1 {
      margin: 20px 0 10px;
      font-size: 2.5em;
    }
    p.slogan {
      font-size: 1.2em;
      font-style: italic;
      margin-bottom: 40px;
    }
    a.button {
      display: inline-block;
      padding: 15px 30px;
      background-color: #f5c169;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
      margin-bottom: 60px;
    }
    a.button:hover {
      background-color: #ffdd87;
    }
    main p {
      font-size: 1.1em;
      margin-bottom: 30px;
    }
    footer {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 20px;
    }
    /* Responsividade */
    @media (max-width: 480px) {
      h1 { font-size: 2em; }
      p.slogan { font-size: 1em; }
      a.button { padding: 12px 20px; }
      img.logo { width: 150px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Caramelo Token Logo" class="logo">
    <h1>Caramelo Token</h1>
    <p class="slogan">"We don’t need pedigree to be legendary"</p>
  </header>

  <main>
    <p>The meme coin inspired by the Brazilian street legend: the Vira Lata Caramelo 🐕</p>
    <a class="button" href="https://pancakeswap.finance/swap?outputCurrency=0x3b88966075Afcd7DadE40f439c1B7DC2539CE80d" target="_blank">
      Buy on PancakeSwap
    </a>
  </main>

  <footer>
    © 2025 Caramelo Token Community
  </footer>
</body>
</html>
